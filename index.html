<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <div>
                <h1>Data Mahasiswa</h1>
                <p>Daftar data mahasiswa</p>
            </div>

            <!-- Mengubah fungsi onclick untuk membuka modal form -->
            <button onclick="bukaModal()">+ Tambah Data</button>
        </div>

        <div class="card">

            <div class="card-header">
                <h2>Daftar Mahasiswa</h2>

                <input
                    type="text"
                    id="search"
                    placeholder="🔍 Cari mahasiswa..."
                    onkeyup="cariData()"
                >
            </div>

            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama</th>
                            <th>Umur</th>
                            <th>Jurusan</th>
                            <th>Nilai</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="tabelData">
                    </tbody>
                </table>

            </div>

        </div>

    </div>

    <!-- ================= MODAL FORM TAMBAH DATA (BARU) ================= -->
    <div id="modalTambah" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Tambah Data Mahasiswa</h2>
            <form id="formMahasiswa" onsubmit="tambahMahasiswa(event)">
                <input type="text" id="nama" placeholder="Nama Mahasiswa" required><br><br>
                <input type="number" id="umur" placeholder="Umur" required><br><br>
                <input type="text" id="jurusan" placeholder="Jurusan" required><br><br>
                <input type="number" id="nilai" placeholder="Nilai" required><br><br>
                
                <button type="submit">Simpan</button>
                <button type="button" onclick="tutupModal()">Batal</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
